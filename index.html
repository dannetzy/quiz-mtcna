<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Admin Quiz - MikroTik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Fira Code', monospace;
            background-color: #0d1117; /* GitHub Dark bg */
            color: #c9d1d9;
            background-image: 
                linear-gradient(rgba(24, 55, 24, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(24, 55, 24, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .terminal-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            box-shadow: 0 0 15px rgba(46, 160, 67, 0.1);
        }

        .btn-option {
            transition: all 0.2s ease;
            border: 1px solid #30363d;
        }

        .btn-option:hover:not(:disabled) {
            border-color: #58a6ff;
            background-color: rgba(88, 166, 255, 0.1);
            transform: translateX(5px);
        }

        .correct {
            background-color: rgba(46, 160, 67, 0.2) !important;
            border-color: #2ea043 !important;
            color: #3fb950;
        }

        .incorrect {
            background-color: rgba(248, 81, 73, 0.2) !important;
            border-color: #f85149 !important;
            color: #ff7b72;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 9999;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(88,166,255,0.2) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            animation: scanline 6s linear infinite;
        }

        @keyframes scanline {
            0% { top: -100px; }
            100% { top: 100%; }
        }

        .typing-animation::after {
            content: '█';
            animation: blink 1s step-start infinite;
            color: #58a6ff;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">
    <div class="scanline"></div>

    <div id="app" class="terminal-box rounded-lg w-full max-w-4xl p-6 md:p-10 relative z-10">
        
        <!-- Header / Status Bar -->
        <div class="flex justify-between items-center border-b border-gray-700 pb-4 mb-6 text-sm text-gray-400">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="ml-2 text-cyan-400">root@mikrotik-sim:~#</span>
            </div>
            <div id="status-bar">STATUS: <span class="text-green-400">READY</span></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="text-center py-10">
            <h1 class="text-3xl md:text-5xl font-bold text-cyan-400 mb-4 typing-animation">Quiz Soal MTCNA</h1>
            <p class="text-gray-400 mb-8 max-w-lg mx-auto">Kelompok: <br>- M. Danne Febrian <br>- Raffles Vinchen Sitorus <br><br>Buka di danne.my.id/quiz-mtcna</p>
            <button onclick="startQuiz()" class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded shadow-[0_0_15px_rgba(8,145,178,0.5)] transition-all">
                > START
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-end mb-4">
                <span id="question-counter" class="text-cyan-400 text-lg font-bold">SOAL [1/25]</span>
                <span class="text-sm text-gray-400">Score: <span id="current-score" class="text-green-400 font-bold">0</span></span>
            </div>
            
            <div class="bg-gray-800 bg-opacity-50 p-4 rounded border border-gray-700 mb-6">
                <h2 id="question-text" class="text-lg md:text-xl font-semibold leading-relaxed text-gray-200"></h2>
            </div>

            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- Options will be injected here -->
            </div>

            <div id="explanation-box" class="hidden bg-blue-900 bg-opacity-20 border-l-4 border-cyan-500 p-4 mb-6 text-sm">
                <h3 class="text-cyan-400 font-bold mb-1">>> SYSTEM_LOG // PENJELASAN:</h3>
                <p id="explanation-text" class="text-gray-300"></p>
            </div>

            <div class="flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2 bg-gray-700 hover:bg-gray-600 border border-gray-500 rounded text-white font-bold transition-all">
                    NEXT_PROCESS() ->
                </button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center py-10">
            <h2 class="text-3xl font-bold text-cyan-400 mb-2">EVALUATION_COMPLETE</h2>
            <div class="text-6xl font-bold mb-6 mt-4" id="final-score">0%</div>
            <p id="result-message" class="text-xl mb-8 text-gray-300"></p>
            
            <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8 text-left bg-gray-800 p-4 rounded border border-gray-700 text-sm">
                <div>Total Soal:</div><div class="text-right text-cyan-400">25</div>
                <div>Benar:</div><div id="correct-count" class="text-right text-green-400">0</div>
                <div>Salah:</div><div id="wrong-count" class="text-right text-red-400">0</div>
            </div>

            <button onclick="restartQuiz()" class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded shadow-[0_0_15px_rgba(8,145,178,0.5)] transition-all">
                > REBOOT_SYSTEM
            </button>
        </div>

    </div>

    <script>
        const quizData = [
            {
                q: "Berapa IP Address default pada RouterBoard MikroTik saat baru pertama kali digunakan atau setelah di-reset konfigurasi?",
                o: ["192.168.1.1", "192.168.0.1", "192.168.88.1", "10.0.0.1"],
                a: 2,
                exp: "Secara default pabrik, MikroTik memberikan IP 192.168.88.1 pada port ether1 atau pada interface bridge (tergantung model router)."
            },
            {
                q: "Berapa port default yang digunakan oleh aplikasi Winbox untuk mengakses MikroTik?",
                o: ["80", "21", "22", "8291"],
                a: 3,
                exp: "Winbox menggunakan protokol TCP pada port 8291. Port 80 untuk HTTP, 21 FTP, dan 22 SSH."
            },
            {
                q: "Jika sebuah RouterBoard mengalami kerusakan sistem operasi (boot failure) atau lupa password, aplikasi resmi MikroTik apa yang digunakan untuk menginstal ulang RouterOS?",
                o: ["WebFig", "Netinstall", "Winbox", "PuTTY"],
                a: 1,
                exp: "Netinstall adalah program berbasis Windows yang memungkinkan instalasi ulang (flashing) RouterOS ke RouterBoard melalui jaringan (kabel UTP) menggunakan protokol BOOTP."
            },
            {
                q: "Jika RouterBoard MikroTik belum memiliki IP Address sama sekali, kita masih bisa login menggunakan Winbox melalui koneksi Layer 2 dengan memanfaatkan apa?",
                o: ["MAC Address", "Subnet Mask", "DNS", "Default Gateway"],
                a: 0,
                exp: "Winbox mendukung fitur MAC-Telnet yang mendeteksi router menggunakan MNDP (MikroTik Neighbor Discovery Protocol) sehingga bisa login menggunakan MAC Address tanpa butuh IP Address."
            },
            {
                q: "Perintah apa pada terminal yang digunakan untuk menyimpan konfigurasi ke dalam bentuk teks (script) yang bisa dibaca dan diedit di teks editor?",
                o: ["/system backup save", "/export", "/file save", "/print"],
                a: 1,
                exp: "Perintah /export menghasilkan konfigurasi dalam bentuk script (berformat .rsc), berbeda dengan backup sistem yang menghasilkan file biner."
            },
            {
                q: "Secara default, file yang dihasilkan dari fitur \"Backup\" pada menu Files memiliki ekstensi apa?",
                o: [".rsc", ".txt", ".backup", ".mik"],
                a: 2,
                exp: "Fitur backup membuat file biner berekstensi .backup yang hanya bisa di-restore ke router dengan tipe dan arsitektur yang sama."
            },
            {
                q: "Untuk meminta alamat IP secara otomatis dari ISP atau modem, menu apa yang harus dikonfigurasi pada Winbox?",
                o: ["IP > DHCP Client", "IP > DHCP Server", "IP > DNS", "IP > Pool"],
                a: 0,
                exp: "DHCP Client bertugas meminta atau menerima alokasi IP Address, Gateway, dan DNS dari DHCP Server (ISP/Modem)."
            },
            {
                q: "Protokol yang berfungsi memetakan IP Address menjadi MAC Address (terlihat di menu IP > ARP) adalah?",
                o: ["DHCP", "DNS", "ICMP", "ARP"],
                a: 3,
                exp: "ARP (Address Resolution Protocol) bertugas memetakan alamat logika (IP Address) ke alamat fisik (MAC Address) pada jaringan lokal."
            },
            {
                q: "Pada Firewall NAT, agar jaringan lokal/LAN bisa terhubung ke internet, Action apa yang digunakan untuk menyamarkan IP private menjadi IP public router?",
                o: ["accept", "drop", "dst-nat", "masquerade"],
                a: 3,
                exp: "Masquerade adalah bentuk khusus dari src-nat yang secara otomatis membaca IP pada interface keluaran (interface publik) untuk meneruskan koneksi dari jaringan lokal ke internet."
            },
            {
                q: "Pada Firewall Filter, Chain apa yang digunakan untuk memfilter atau menangani trafik paket yang ditujukan ke arah router itu sendiri (misalnya ping ke IP router, atau login Winbox)?",
                o: ["forward", "input", "output", "prerouting"],
                a: 1,
                exp: "Chain input memproses trafik yang destination address-nya adalah alamat IP dari router itu sendiri."
            },
            {
                q: "Pada Firewall Filter, Chain apa yang bertugas menangani trafik paket yang hanya melewati router (dari LAN menuju internet, atau sebaliknya)?",
                o: ["input", "output", "forward", "postrouting"],
                a: 2,
                exp: "Chain forward memproses trafik client yang melewati router. Router dalam hal ini hanya bertugas sebagai perantara (gateway)."
            },
            {
                q: "Agar MikroTik bisa berfungsi sebagai DNS Server yang memproses request DNS dari komputer client di jaringan lokal, opsi apa yang harus dicentang pada menu IP > DNS?",
                o: ["Allow Remote Requests", "Allow Cache Size", "Use Peer DNS", "Cache Requests"],
                a: 0,
                exp: "Mencentang opsi \"Allow Remote Requests\" mengizinkan router merespons kueri DNS dari luar, sehingga client dapat menjadikan IP router sebagai DNS server mereka."
            },
            {
                q: "Berapa alamat Destination Address (Dst. Address) yang diisikan saat membuat Default Route agar router bisa mengakses seluruh internet?",
                o: ["192.168.0.0/24", "0.0.0.0/0", "127.0.0.1", "255.255.255.0"],
                a: 1,
                exp: "0.0.0.0/0 mewakili any network atau semua jaringan IP yang tidak ada secara spesifik di tabel routing lokal."
            },
            {
                q: "Mode wireless yang digunakan untuk menjadikan interface WLAN MikroTik sebagai pemancar (Access Point) agar bisa dihubungkan ke banyak client adalah?",
                o: ["station", "wds-slave", "ap-bridge", "bridge"],
                a: 2,
                exp: "Mode ap-bridge berfungsi sebagai Access Point tipe Point-to-MultiPoint. Mode bridge hanya untuk Access Point Point-to-Point (hanya 1 client)."
            },
            {
                q: "Mode wireless yang digunakan saat RouterBoard MikroTik bertindak sebagai penerima sinyal (client) dari Access Point lain adalah?",
                o: ["ap-bridge", "station", "wds-station", "nstreme"],
                a: 1,
                exp: "Mode station menjadikan radio MikroTik sebagai wireless client standar."
            },
            {
                q: "Fitur yang digunakan untuk menggabungkan beberapa interface (misalnya ether2, ether3, dan wlan1) agar berada dalam satu segmen jaringan dan satu broadcast domain yang sama adalah?",
                o: ["VLAN", "Routing", "Bridge", "Bonding"],
                a: 2,
                exp: "Bridge berfungsi seperti switch virtual secara perangkat lunak (software) di dalam MikroTik yang menyatukan beberapa port ke dalam satu jaringan Layer 2."
            },
            {
                q: "Fitur yang paling umum digunakan untuk membatasi (melimit) bandwidth klien secara mudah dan sederhana di MikroTik adalah?",
                o: ["PCQ", "Queue Tree", "Simple Queue", "Firewall Mangle"],
                a: 2,
                exp: "Simple Queue didesain khusus untuk kemudahan konfigurasi pembatasan bandwidth berdasarkan IP target, subnet, maupun interface."
            },
            {
                q: "Saat membuat pengaturan di Simple Queue, kolom apa yang harus diisi dengan IP Address klien yang ingin dilimit internetnya?",
                o: ["Target", "Destination", "Max Limit", "Time"],
                a: 0,
                exp: "Kolom Target menentukan IP/Network/Interface dari klien lokal yang kecepatan akses datanya ingin dibatasi."
            },
            {
                q: "Metode manajemen antrean (Queue Type) di MikroTik yang digunakan untuk membagi bandwidth secara dinamis, adil, dan merata kepada banyak klien sekaligus adalah?",
                o: ["FIFO", "RED", "SFQ", "PCQ"],
                a: 3,
                exp: "PCQ (Per Connection Queue) mampu memisahkan lalu lintas jaringan secara otomatis per IP/koneksi dan membaginya sama rata (equal share)."
            },
            {
                q: "Layanan tunneling apa yang sering digunakan oleh ISP atau provider untuk memberikan akses internet ke router pelanggan yang membutuhkan proses dial-up menggunakan username dan password?",
                o: ["PPTP", "L2TP", "PPPoE", "OpenVPN"],
                a: 2,
                exp: "PPPoE (Point-to-Point Protocol over Ethernet) merupakan standar tunneling lapisan data link yang jamak dipakai ISP kabel/fiber untuk autentikasi pelanggannya."
            },
            {
                q: "Untuk dapat menggunakan mode wireless ap-bridge (sebagai pemancar Wi-Fi biasa), RouterBoard minimal harus memiliki lisensi RouterOS level berapa?",
                o: ["Level 3", "Level 4", "Level 5", "Level 6"],
                a: 1,
                exp: "Lisensi Level 3 (seperti pada antena SXT/LHG CPE) hanya mendukung mode station (client) dan bridge (PtP 1 client). Lisensi minimum untuk Access Point (banyak client) adalah Level 4."
            },
            {
                q: "Fitur yang memastikan jam dan tanggal pada RouterBoard MikroTik selalu cocok dan tidak berubah saat restart dengan cara sinkronisasi ke server internet adalah?",
                o: ["SNMP", "NTP / SNTP Client", "Scheduler", "Watchdog"],
                a: 1,
                exp: "NTP (Network Time Protocol) / SNTP Client mengambil referensi waktu dari server NTP publik karena kebanyakan RouterBoard MikroTik tidak memiliki baterai CMOS internal."
            },
            {
                q: "Tool pada MikroTik yang berfungsi untuk melihat lalu lintas (trafik) jaringan yang mengalir secara real-time termasuk protokol, IP pengirim, dan IP tujuan pada interface tertentu adalah?",
                o: ["Ping", "Traceroute", "Torch", "Packet Sniffer"],
                a: 2,
                exp: "Torch adalah tool troubleshooting andalan untuk memonitor trafik, besar bandwidth yang terpakai, dan detail koneksi secara langsung tanpa harus menyimpannya (seperti pada Packet Sniffer)."
            },
            {
                q: "Pada tabel routing (IP > Routes), terdapat kolom status (flag). Apa arti tanda huruf \"D\" pada sebuah route?",
                o: ["Distance", "Drop", "Dynamic", "Disabled"],
                a: 2,
                exp: "\"D\" atau Dynamic menandakan rute tersebut dibuat secara otomatis oleh sistem, misalnya dari DHCP Client, PPPoE Client, atau protokol routing dinamis seperti OSPF."
            },
            {
                q: "Perangkat bawaan (tool) di MikroTik yang digunakan untuk melacak jalan (hop router) mana saja yang dilewati sebuah paket dari sumber sampai ke tujuannya adalah?",
                o: ["Bandwidth Test", "Ping", "IP Scan", "Traceroute"],
                a: 3,
                exp: "Traceroute bekerja dengan mengirimkan paket ICMP menggunakan batasan TTL (Time to Live) yang meningkat untuk menampilkan setiap lompatan router di jalur jaringan."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let hasAnswered = false;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const statusBar = document.getElementById('status-bar');
        
        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            statusBar.innerHTML = 'STATUS: <span class="text-yellow-400">IN_PROGRESS</span>';
            loadQuestion();
        }

        function loadQuestion() {
            hasAnswered = false;
            const q = quizData[currentQuestion];
            
            document.getElementById('question-counter').innerText = `SOAL [${currentQuestion + 1}/${quizData.length}]`;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];
            
            q.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option w-full text-left p-4 rounded bg-gray-800 bg-opacity-60 text-gray-300 flex items-center group';
                btn.innerHTML = `<span class="bg-gray-700 text-cyan-400 font-bold px-3 py-1 rounded mr-3 group-hover:bg-cyan-900">${labels[index]}</span> ${opt}`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIndex, btnElement) {
            if (hasAnswered) return;
            hasAnswered = true;

            const q = quizData[currentQuestion];
            const isCorrect = (selectedIndex === q.a);
            const allBtns = document.querySelectorAll('.btn-option');

            // Disable all buttons
            allBtns.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.add('cursor-not-allowed', 'opacity-80');
                
                // Highlight correct answer
                if (idx === q.a) {
                    btn.classList.add('correct');
                }
            });

            if (isCorrect) {
                score++;
                document.getElementById('current-score').innerText = score;
            } else {
                btnElement.classList.add('incorrect');
            }

            // Show explanation
            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-box').classList.remove('hidden');
            
            // Show next button
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            if (currentQuestion === quizData.length - 1) {
                nextBtn.innerText = 'SHOW_RESULTS()';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            statusBar.innerHTML = 'STATUS: <span class="text-cyan-400">TERMINATED</span>';

            const percentage = Math.round((score / quizData.length) * 100);
            const finalScoreEl = document.getElementById('final-score');
            const resultMsg = document.getElementById('result-message');
            
            finalScoreEl.innerText = `${percentage}%`;
            
            if (percentage >= 80) {
                finalScoreEl.className = 'text-6xl font-bold mb-6 mt-4 text-green-400';
                resultMsg.innerText = "Sistem Otorisasi Diterima. Anda seorang Network Admin yang handal!";
            } else if (percentage >= 50) {
                finalScoreEl.className = 'text-6xl font-bold mb-6 mt-4 text-yellow-400';
                resultMsg.innerText = "Akses Terbatas. Pengetahuan jaringan Anda cukup baik, namun perlu peningkatan.";
            } else {
                finalScoreEl.className = 'text-6xl font-bold mb-6 mt-4 text-red-500';
                resultMsg.innerText = "Akses Ditolak. Silakan pelajari kembali dasar-dasar MikroTik dan Jaringan.";
            }

            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = quizData.length - score;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('current-score').innerText = score;
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            statusBar.innerHTML = 'STATUS: <span class="text-green-400">READY</span>';
        }
    </script>
</body>
</html>
